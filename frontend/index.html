<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Authenticator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <header>
            <h1>News Authenticator</h1>
            <p>Paste a news paragraph and our AI will analyze its authenticity.</p>
        </header>

        <main>
            <div id="chatWindow" class="chat-window">
                <div class="message bot-message">
                    <div class="bubble">
                        👋 Hi! Paste a news paragraph below (at least 50 words) and I'll tell you whether it looks real or fake — with reasoning and web sources.
                    </div>
                </div>
            </div>

            <div class="input-section">
                <textarea id="newsInput" placeholder="Enter the news paragraph here (minimum 50 words)..."></textarea>
                <div class="input-bar">
                    <span id="wordCounter" class="word-counter">0 / 50 words minimum</span>
                    <button id="analyzeBtn" disabled>Analyze News</button>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by Me</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
